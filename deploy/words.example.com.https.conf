# 证书签发成功后才安装这份配置；无需改动其他网站的 server 块。
server {
    listen 80;
    server_name words.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://words.example.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name words.example.com;
    ssl_certificate /etc/letsencrypt/live/words.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/words.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/words.example.com.access.log;
    error_log /var/log/nginx/words.example.com.error.log;
    client_max_body_size 32k;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
