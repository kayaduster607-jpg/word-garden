# 本站正式使用普通 HTTP；compose.yaml 的 WORD_ORIGIN 必须为 http://words.example.com。
# 请先在 nginx -T 的输出中确认 /etc/nginx/conf.d/*.conf 确实被包含。
server {
    listen 80;
    server_name words.example.com;
    access_log /var/log/nginx/words.example.com.access.log;
    error_log /var/log/nginx/words.example.com.error.log;
    client_max_body_size 32k;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
